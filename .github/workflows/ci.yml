name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and SQL tests
        run: npm test
      - name: Build Worker + assets
        run: npm run build
      - name: Apply D1 migrations locally
        run: npm run db:migrate:local
      - name: Seed fictional development tenants
        run: npm run db:seed:local
      - name: Build landing page (site/)
        run: npm ci --no-audit --no-fund --prefix site && npm run build --prefix site
