# Medição do classificador de intenção por LLM sobre o corpus fictício (DEC-202, plano de 18/11/2026).
# Só manual: cada corrida chama o modelo real nas frases que o léxico não decide (teto US$ 2 no teste).
# Não corre em PR nem em push. Usa os segredos do environment `staging` (os mesmos do antigo
# shadow-replay): AI_GATEWAY_ID, AI_GATEWAY_TOKEN, CLOUDFLARE_ACCOUNT_ID e, se existir, ANTHROPIC_API_KEY.
# Dados: só frases fictícias de `src/clinic/ai/evals/intent/corpus.ts`; nada de clientes reais.
name: Avaliação de intenção (LLM)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-intent
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verificar segredos (só nomes, nunca valores)
        env:
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for v in AI_GATEWAY_ID AI_GATEWAY_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no environment 'staging':$missing"
            exit 1
          fi
      - name: Medição léxica (sem custo)
        run: npx vitest run src/clinic/ai/evals/intent/intent.eval.test.ts
      - name: Medição com o modelo real
        env:
          EVAL_INTENT_LLM: live
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          # BYOK: o gateway sem Unified Billing exige a chave da Anthropic (erro 2044 sem ela).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_BYOK_ALIAS: staging
        run: npx vitest run src/clinic/ai/evals/intent/intent.llm.eval.test.ts
      - name: Relatório no resumo do job
        if: always()
        run: |
          if [ -f .eval/intent-llm.md ]; then cat .eval/intent-llm.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-llm
          path: .eval/intent-llm.md
          if-no-files-found: ignore
          retention-days: 14
