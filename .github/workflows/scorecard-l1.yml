# Scorecard L1 num comentário do PR (metodologia de avaliação conversacional, DEC-146).
# Só informa: não bloqueia o merge. As invariantes continuam a bloquear pelo job `verify` (DEC-108).
# Corre apenas em PRs que tocam no atendimento conversacional.
name: Scorecard L1

on:
  pull_request:
    paths:
      - 'src/clinic/ai/**'
      - 'src/whatsapp/flow/**'
      - 'src/clinic/proposals/**'
      - 'docs/implementation/avaliacao/**'
      - 'scripts/scorecard-comment.mjs'
      - '.github/workflows/scorecard-l1.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scorecard-l1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scorecard:
    # PRs de forks não têm token de escrita: o comentário seria recusado.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run L1 scorecard
        id: run
        # O resultado vai para o comentário; um gate falhado também chega aqui (e ao job verify).
        continue-on-error: true
        run: npm run eval:scorecard
      - name: Changed files
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
      - name: Build comment
        env:
          SCORECARD_RUN_FAILED: ${{ steps.run.outcome == 'failure' && '1' || '0' }}
        run: node scripts/scorecard-comment.mjs changed-files.txt scorecard-comment.md
      - name: Create or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- scorecard-l1 -->"))][0].id // empty')"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@scorecard-comment.md >/dev/null
            echo "Comentário $id atualizado"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@scorecard-comment.md >/dev/null
            echo "Comentário criado"
          fi
