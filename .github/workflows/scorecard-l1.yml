# Scorecard L1 num comentário do PR (metodologia de avaliação conversacional, DEC-146).
# Só informa: não bloqueia o merge. As invariantes continuam a bloquear pelo job `verify` (DEC-108).
# Corre apenas em PRs que tocam no atendimento conversacional.
name: Scorecard L1

on:
  pull_request:
    paths:
      - 'src/clinic/ai/**'
      - 'src/whatsapp/flow/**'
      - 'src/clinic/proposals/**'
      - 'docs/implementation/avaliacao/**'
      - 'scripts/scorecard-comment.mjs'
      - '.github/workflows/scorecard-l1.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scorecard-l1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scorecard:
    # PRs de forks não têm token de escrita: o comentário seria recusado.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Reuse L1 output for the same base tip across PRs/pushes (~6 min saved on cache hit).
      - name: Restore base L1 cache
        id: base_cache
        uses: actions/cache@v4
        with:
          path: base-latest.json
          key: scorecard-l1-base-${{ github.event.pull_request.base.sha }}
      - name: L1 on the base branch (what the PR is compared with)
        # A linha de base gravada fica atrás da main sempre que outros PRs acrescentam casos
        # sem a regravar; comparar com ela atribuía ao PR mudanças que não são dele.
        # Se esta corrida falhar, o scorecard volta a comparar com a linha de base gravada.
        # BASE_SHA (não o nome da branch) evita injecção no shell e fixa o tip da base do evento.
        id: base
        if: steps.base_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add ../base-tree "$BASE_SHA"
          # Deps do PR na base enviesam a comparação se o lockfile mudou.
          if cmp -s package-lock.json ../base-tree/package-lock.json; then
            ln -s "$GITHUB_WORKSPACE/node_modules" ../base-tree/node_modules
          else
            (cd ../base-tree && npm ci --no-audit --no-fund)
          fi
          (cd ../base-tree && EVAL_SCORECARD=1 npx vitest run src/clinic/ai/evals/dialogs/dialogs.test.ts) || true
          if [ -f ../base-tree/.eval/l1-latest.json ]; then
            cp ../base-tree/.eval/l1-latest.json base-latest.json
            echo "has_baseline=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run L1 scorecard
        id: run
        env:
          # Cache hit ou corrida fresca da base: compara com esse artefacto; senão linha gravada.
          EVAL_BASELINE_PATH: ${{ (steps.base_cache.outputs.cache-hit == 'true' || steps.base.outputs.has_baseline == '1') && 'base-latest.json' || '' }}
        # O resultado vai para o comentário; um gate falhado também chega aqui (e ao job verify).
        continue-on-error: true
        run: npm run eval:scorecard
      - name: Changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "${BASE_SHA}...HEAD" > changed-files.txt
      - name: Build comment
        env:
          SCORECARD_RUN_FAILED: ${{ steps.run.outcome == 'failure' && '1' || '0' }}
        run: node scripts/scorecard-comment.mjs changed-files.txt scorecard-comment.md
      - name: Create or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- scorecard-l1 -->"))][0].id // empty')"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@scorecard-comment.md >/dev/null
            echo "Comentário $id atualizado"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@scorecard-comment.md >/dev/null
            echo "Comentário criado"
          fi
