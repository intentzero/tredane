<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de partilha da landing (1200×630)</title>
<style>
/* Imagem de partilha (og:image) da landing, violeta e lima (23/11/2026). Gerada por gerar.sh
   em site/public/og-image.png. Geist da própria landing; capturas de site/src/assets/app. */
@import url("../node_modules/@fontsource/geist/400.css");
@import url("../node_modules/@fontsource/geist/600.css");
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: Geist, system-ui, sans-serif; color: #FFFFFF; -webkit-font-smoothing: antialiased;
  background: linear-gradient(115deg, #211339 58%, #2C1A4A); position: relative; }
.aneis { position: absolute; left: 700px; top: 38px; width: 520px; height: 520px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 0 0 44px rgba(255,255,255,.03), 0 0 0 45px rgba(255,255,255,.14), 0 0 0 96px rgba(255,255,255,.02), 0 0 0 97px rgba(255,255,255,.09); }
.brilho { position: absolute; left: 640px; top: -120px; width: 620px; height: 620px; border-radius: 50%; background: #5C32C9; opacity: .30; filter: blur(110px); }
.texto { position: absolute; left: 72px; top: 64px; width: 600px; height: 502px; display: flex; flex-direction: column; justify-content: space-between; }
.logo { display: block; height: 52px; width: auto; align-self: flex-start; }
h1 { font-size: 60px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; }
h1 em { display: block; margin-top: 6px; font-style: normal; color: #DCCBFF; }
.apoio { display: flex; align-items: center; gap: 12px; font-size: 24px; line-height: 1.3; color: #E3D9F6; }
.apoio i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: #D5FF55; }
.fone { position: absolute; padding: 8px; border-radius: 34px; background: #FFFFFF; border: 1px solid #DFD5EF; box-shadow: 0 40px 70px -26px rgba(0,0,0,.7); }
.fone img { display: block; width: 100%; height: auto; border-radius: 27px; }
.fone.frente { left: 716px; top: 74px; width: 236px; z-index: 2; }
.fone.fundo { left: 936px; top: 156px; width: 214px; z-index: 1; }
</style>
</head>
<body>
<span class="brilho"></span>
<span class="aneis"></span>
<div class="texto">
<img class="logo" src="../public/tredane-horizontal-escuro.svg" alt="Tredane">
<h1>O atendimento da sua clínica no WhatsApp, <em>do «oi» ao horário marcado.</em></h1>
<p class="apoio"><i></i>Para clínicas de estética e depilação. Em piloto.</p>
</div>
<div class="fone frente"><img src="../src/assets/app/conversa.png" alt=""></div>
<div class="fone fundo"><img src="../src/assets/app/agenda.png" alt=""></div>
</body>
</html>
