<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conhecimento — lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007F78}a:hover{color:#00665F}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #007F78;outline-offset:2px}
.kn-row:hover{background:#EAF7F2}
.kn-chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF9; color: #203632; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; height: 56px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #D6E6DE; display: flex; align-items: center; gap: 4px; padding: 0 4px">
<a href="#" aria-label="Voltar à Clínica" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #203632; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex: 1; font-size: 16px; font-weight: 600">Conhecimento</h1>
<a href="ConhecimentoCategorias.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 6px; color: #00665F; font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Categorias</a>
</header>

<div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">

<section aria-labelledby="kn-quota" style="background: #FFFFFF; border: 1px solid #D6E6DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="kn-quota" style="margin: 0; font-size: 14px; font-weight: 600"><span style="font-size: 22px">6</span> de 15 publicadas</h2>
<span style="font-size: 13px; color: #52645F">2 rascunhos</span>
</div>
<div role="img" aria-label="6 de 15 respostas publicadas" style="height: 6px; border-radius: 999px; background: #D6E6DE; overflow: hidden"><div style="width: 40%; height: 100%; background: #007F78; border-radius: 999px"></div></div>
<p style="margin: 0; font-size: 13px; color: #435A53; display: flex; gap: 8px; align-items: flex-start"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>A assistente envia o texto exato que você aprovou. A equipe vê a resposta na conversa.</span></p>
</section>

<label style="position: relative; display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar pergunta ou resposta</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52645F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 13px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" placeholder="Buscar pergunta ou resposta" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #718A81; border-radius: 8px; background: #FFFFFF; font-size: 14px; color: #203632">
</label>

<div class="kn-chips" role="group" aria-label="Filtrar por categoria" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<button type="button" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}} <span style="opacity: .75">{{chip.count}}</span></button>
</sc-for>
</div>

<sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: #435A53; display: flex; justify-content: space-between"><span>{{group.name}}</span><span style="font-weight: 400; color: #52645F">{{group.count}}</span></h2>
<ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #D6E6DE; border-radius: 12px; overflow: hidden">
<sc-for list="{{group.entries}}" as="e" hint-placeholder-count="2">
<li style="{{e.divider}}">
<a href="ConhecimentoEditor.dc.html" class="kn-row" style="display: flex; gap: 12px; align-items: center; min-height: 64px; padding: 12px 12px 12px 16px; color: inherit; text-decoration: none">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 500; font-size: 16px">{{e.q}}</span>
<span style="font-size: 13px; color: #52645F; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{e.a}}</span>
<span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px">
<sc-if value="{{e.published}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; font-weight: 500; color: #1F7A4D; background: #EAF5EF; border-radius: 999px; padding: 2px 8px">Publicada</span>
</sc-if>
<sc-if value="{{e.draft}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 500; color: #6E4200; background: #FFF7EA; border: 1px solid #EBCB94; border-radius: 999px; padding: 1px 8px">Rascunho</span>
</sc-if>
<sc-if value="{{e.locked}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: #52645F; display: inline-flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Vem de Recebimento</span>
</sc-if>
</span>
</div>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#718A81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</li>
</sc-for>
</ul>
</section>
</sc-for>

</div>

<div style="flex: none; background: #FFFFFF; border-top: 1px solid #D6E6DE; padding: 12px 16px 28px">
<a href="ConhecimentoEditor.dc.html" style="height: 44px; border-radius: 8px; background: #00665F; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Nova pergunta</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var filter = (this.state && this.state.filter) || 'all';
    var data = [
      { name: 'Acesso', entries: [
        { q: 'Tem estacionamento?', a: 'Sim, temos 2 vagas no subsolo do prédio. Avise na portaria que vem à Clínica Aurora.', status: 'published' },
        { q: 'Qual o endereço?', a: 'Rua das Acácias, 120, sala 304, Centro. Ficamos ao lado da farmácia.', status: 'published' },
        { q: 'Tem elevador ou rampa?', a: 'Sim, o prédio tem elevador e rampa na entrada principal.', status: 'draft' }
      ]},
      { name: 'Pagamento', entries: [
        { q: 'Qual a política do sinal / Pix?', a: 'Pedimos um sinal por Pix para garantir o horário. O valor é descontado no dia do atendimento.', status: 'published', locked: true },
        { q: 'Aceitam cartão?', a: 'Aceitamos crédito, débito e Pix. Parcelamos no crédito; consulte as condições na recepção.', status: 'published' },
        { q: 'Dá para pagar em dinheiro?', a: 'Sim, aceitamos dinheiro no dia do atendimento.', status: 'published' }
      ]},
      { name: 'Visita', entries: [
        { q: 'Posso levar acompanhante?', a: 'Pode sim. A sala de espera tem lugar para uma pessoa acompanhando.', status: 'draft' },
        { q: 'Com quanto tempo de antecedência chego?', a: 'Chegue 10 minutos antes para o cadastro.', status: 'draft' }
      ]}
    ];
    var self = this;
    var chipStyle = function (on) {
      return 'flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap; ' +
        (on ? 'background: #00665F; color: #FFFFFF; border: 1px solid #00665F; font-weight: 500' : 'background: #FFFFFF; color: #203632; border: 1px solid #718A81');
    };
    var total = data.reduce(function (n, g) { return n + g.entries.length; }, 0);
    var chips = [{ id: 'all', label: 'Todas', count: total }].concat(data.map(function (g) { return { id: g.name, label: g.name, count: g.entries.length }; }))
      .map(function (c) {
        return { label: c.label, count: c.count, pressed: c.id === filter, style: chipStyle(c.id === filter), pick: function () { self.setState({ filter: c.id }); } };
      });
    var groups = data.filter(function (g) { return filter === 'all' || g.name === filter; }).map(function (g) {
      return {
        name: g.name,
        count: g.entries.length === 1 ? '1 pergunta' : g.entries.length + ' perguntas',
        entries: g.entries.map(function (e, i) {
          return { q: e.q, a: e.a, published: e.status === 'published', draft: e.status === 'draft', locked: !!e.locked, divider: i === 0 ? '' : 'border-top: 1px solid #D6E6DE' };
        })
      };
    });
    return { chips: chips, groups: groups };
  }
}
</script>
</body>
</html>
