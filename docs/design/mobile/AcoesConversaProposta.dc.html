<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folha Mais da conversa (proposta — sem duplicatas)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif}
.ph{--app:#F5F4EF;--card:#fff;--sunk:#EEEDE7;--tx:#142625;--tx2:#424B4A;--mu:#566160;--pr:#0E5A5C;--prInk:#0A4547;--prT:#E7F1F1;--prB:#B3D1D1;--dg:#B42318;--dgB:#F1B8B2;--ai:#4B2A9E;--aiB:#6B3FD4;--aiT:#F7F4FD;--aiAv:#E7E0F8;--ctl:#7A8584;--bd:#E1E3E0;width:390px;height:844px;box-sizing:border-box;background:var(--app);color:var(--tx);font-size:14px;line-height:1.4;position:relative;overflow:hidden}
.ph button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.bg{position:absolute;inset:0;background:var(--card);padding:16px}
.bg i{display:block;height:44px;border-radius:16px;background:var(--sunk);margin-bottom:10px;width:70%}
.scrim{position:absolute;inset:0;background:rgba(20,38,37,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:8px 16px 24px;display:flex;flex-direction:column}
.hdl{width:40px;height:4px;border-radius:2px;background:var(--ctl);margin:0 auto 12px}
.who{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--aiAv);color:var(--ai)}
.hint{margin:0 0 8px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13px;color:var(--tx2);line-height:1.35}
.row{display:flex;align-items:center;gap:14px;height:52px;border:0;background:none;text-align:left;width:100%;padding:0 4px;border-bottom:1px solid var(--bd);font-weight:500}
.row svg{flex:none;color:var(--tx2)}
.row:last-of-type{border-bottom:0}
</style>
</helmet>
<!--
  M-55 Proposto (31/10/2026): folha ⋮ só com acções de conversa/pipeline.
  Resumo da IA e Bloquear saem daqui — ficam em Detalhes (Ver contato).
-->
<div class="ph">
  <div class="bg" aria-hidden="true"><i></i><i style="margin-left:auto;background:#E7F1F1"></i><i style="width:50%"></i></div>
  <div class="scrim"></div>
  <section class="sheet" role="dialog" aria-label="Opções da conversa">
    <span class="hdl"></span>
    <div class="who">
      <span class="av" aria-hidden="true">JP</span>
      <div style="flex:1;min-width:0"><div style="font-weight:600">Juliana Prado</div><div style="font-size:14px;color:var(--mu)">+55 11 9••••-0142 · Depilação a laser</div></div>
    </div>
    <p class="hint">Resumo da IA e Bloquear contato ficam em <strong>Detalhes</strong> (Ver contato).</p>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Ver contato</button>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Reservar bloco (por período)</button>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg><span style="flex:1">Marcar como «Horário proposto»<span style="display:block;font-size:12px;font-weight:400;color:var(--mu)">Etapa só manual nesta correção</span></span></button>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Marcar como perdida</button>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg>Transferir para outra pessoa</button>
    <button class="row"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Encerrar conversa</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
