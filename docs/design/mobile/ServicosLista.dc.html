<head>
<meta charset="utf-8">
<title>Clínica — Serviços</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#0E5A5C}a:hover{color:#0A4547}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #142625; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.35; overflow: hidden">

<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px 0 4px; box-sizing: border-box; border-bottom: 1px solid #E1E3E0; flex: none">

</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 18px; font-weight: 600">Serviços</h1>
<span style="font-size: 13px; color: #566160">Clínica · 9 ativos</span>
</div>
<button style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: #0E5A5C; color: #FFFFFF; font-size: 14px; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #EEEDE7; flex: none">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input type="search" placeholder="Buscar serviço" aria-label="Buscar serviço" style="flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: #142625; outline: none">
</label>
<button aria-pressed="false" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #7A8584; background: #FFFFFF; color: #142625; font-size: 13px; flex: none">Inativos</button>
</div>

<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
<button style="display: flex; align-items: center; gap: 8px; width: 100%; min-height: 62px; padding: 8px 8px 8px 16px; border: 0; border-bottom: 1px solid #EEEDE7; background: #FFFFFF; text-align: left; color: inherit; font-size: 14px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: baseline; gap: 12px"><span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span><span style="font-weight: 600; flex: none">{{ s.price }}</span></span>
<span style="font-size: 13px; color: #566160; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.meta }}</span>
</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="m9 5 7 7-7 7"/></svg>
</button>
</sc-for>
</main>

<nav aria-label="Áreas" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 56px; border-top: 1px solid #E1E3E0; background: #FFFFFF; flex: none">
<a href="ConversasListaUrgencia.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: #566160; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Conversas</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: #566160; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v14M12 4v8M18 4v11"/></svg>Acompanhar</a>

<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: #566160; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Clientes</a>
<a href="ClinicaIndice.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #0E5A5C; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Clínica</a>
</nav>

</div>
