<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agenda com topo compacto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A4547}a:hover{color:#142625}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F4EF; font-family: Roboto, Helvetica, Arial, sans-serif; color: #142625; overflow: hidden">
  <header style="height: 64px; box-sizing: border-box; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E1E3E0; display: flex; align-items: flex-start; gap: 12px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 500">Agenda</h1>
      <span style="font-size: 13px; color: #424B4A">Clínica Exemplo <span style="color: #1F7A4D">· Ao vivo</span></span>
    </div>
  </header>
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px">
      <h2 style="flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; white-space: nowrap">Hoje · qui, 12 nov</h2>
      <div role="group" aria-label="Visão da agenda" style="display: flex; padding: 3px; background: #EEEDE7; border-radius: 8px">
        <button aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: #FFFFFF; color: #142625; font: 500 13px Roboto, sans-serif">Dia</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: #424B4A; font: 400 13px Roboto, sans-serif">Semana</button>
      </div>
    </div>
    <div role="group" aria-label="Dias da semana" style="display: flex; align-items: center; padding: 0 4px">
      <button aria-label="Semana anterior" style="width: 32px; height: 48px; border: 0; background: none; color: #424B4A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button aria-pressed="{{d.on}}" style="height: 48px; border: 0; border-radius: 12px; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: Roboto, sans-serif"><span style="font-size: 11px">{{d.w}}</span><span style="font-size: 16px; font-weight: 500">{{d.n}}</span><span aria-hidden="true" style="width: 4px; height: 4px; border-radius: 999px; background: {{d.dot}}"></span></button>
        </sc-for>
      </div>
      <button aria-label="Próxima semana" style="width: 32px; height: 48px; border: 0; background: none; color: #424B4A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
  </div>
  <div style="position: relative; display: flex; gap: 8px; padding: 8px 16px; overflow: hidden">
    <button aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: #142625; color: #FFFFFF; font: 400 13px Roboto, sans-serif; white-space: nowrap">Gi · 4</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #7A8584; border-radius: 999px; background: #FFFFFF; color: #142625; font: 400 13px Roboto, sans-serif">Paulo</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #7A8584; border-radius: 999px; background: #FFFFFF; color: #142625; font: 400 13px Roboto, sans-serif">Samua</button>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 4px 16px">
    <sc-for list="{{apts}}" as="a" hint-placeholder-count="7">
      <div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 44px; font-size: 13px; font-weight: 500; padding-top: 10px">{{a.t}}</span><div style="flex: 1; padding: 8px 12px; background: #FFFFFF; border: 1px solid #E1E3E0; border-radius: 12px"><strong style="display: block; font-size: 14px; font-weight: 500">{{a.n}}</strong><span style="font-size: 13px; color: #424B4A">{{a.s}}</span></div></div>
    </sc-for>
  </div>
  <nav aria-label="Áreas" style="height: 64px; background: #FFFFFF; border-top: 1px solid #E1E3E0; display: flex; align-items: center; justify-content: space-around; font-size: 11px; color: #566160"><span>Conversas</span><span>Acompanhar</span><strong style="color: #0A4547; font-weight: 500">Agenda</strong><span>Clientes</span><span>Clínica</span></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const mk = (w, n, c, on) => ({ w, n, on: on ? 'true' : 'false', bg: on ? '#0E5A5C' : 'transparent', fg: on ? '#FFFFFF' : '#142625', dot: c ? (on ? '#FFFFFF' : '#0E5A5C') : 'transparent' });
return {
days: [mk('seg','9',2),mk('ter','10',0),mk('qua','11',3),mk('qui','12',4,true),mk('sex','13',1),mk('sáb','14',0),mk('dom','15',0)],
apts: [{t:'10:00',n:'Marina Alves',s:'Depilação · até 11:00 · Sala Depilação'},{t:'13:00',n:'Carla Mendes',s:'Depilação · até 13:40 · Sala Depilação'},{t:'14:30',n:'Juliana Prado',s:'Depilação · até 15:10 · Sala Depilação'},{t:'16:30',n:'Renata Lima',s:'Massagem · até 17:30 · Sala de Massagem'}]
}; }
}
</script>
</body>
</html>
