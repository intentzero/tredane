<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Horário — semana e calendário</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #142625; font-size: 14px; line-height: 1.4; position: relative">
  <header style="flex: none; background: #FFFFFF; border-bottom: 1px solid #E1E3E0; padding: 8px 12px 12px 4px">
    <div style="display: flex; align-items: center; gap: 4px; min-height: 48px">
      <a href="ClinicaSemana.dc.html" aria-label="Voltar para a Clínica" style="width: 44px; height: 44px; display: grid; place-items: center; color: #142625; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
      <h1 style="margin: 0; flex: 1; font-size: 18px; font-weight: 600">Horário</h1>
    </div>
    <div role="tablist" aria-label="Visão do horário" style="margin: 4px 0 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 999px; background: #EEEDE7">
      <button type="button" role="tab" aria-selected="{{emSemana}}" onClick="{{verSemana}}" style="{{tabSemana}}">Semana</button>
      <button type="button" role="tab" aria-selected="{{emCal}}" onClick="{{verCal}}" style="{{tabCal}}">Calendário</button>
    </div>
  </header>

  <!-- SEMANA -->
  <sc-if value="{{emSemana}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div role="group" aria-label="Mostrar na semana" style="display: flex; gap: 8px; overflow-x: auto">
        <sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}"><span style="{{f.dot}}"></span>{{f.nome}}</button>
        </sc-for>
      </div>

      <div style="border-radius: 20px; background: #FFFFFF; padding: 14px 16px 16px">
        <div style="display: grid; grid-template-columns: 40px 1fr; gap: 0 8px; font-size: 12px; color: #566160; margin-bottom: 4px">
          <span></span>
          <span style="display: flex; justify-content: space-between"><span>08h</span><span>10h</span><span>12h</span><span>14h</span><span>16h</span><span>18h</span><span>20h</span></span>
        </div>
        <sc-for list="{{linhas}}" as="d" hint-placeholder-count="7">
          <div style="display: grid; grid-template-columns: 40px 1fr; gap: 0 8px; align-items: center; min-height: 44px; border-top: 1px solid #EEEDE7">
            <span style="font-weight: 600">{{d.nome}}</span>
            <div style="position: relative; height: 28px; border-radius: 8px; background: #F5F4EF">
              <span aria-hidden="true" style="{{d.clinica}}"></span>
              <sc-for list="{{d.pessoas}}" as="p" hint-placeholder-count="1">
                <span aria-hidden="true" style="{{p.style}}"></span>
              </sc-for>
              <span style="{{d.fechado}}">Fechado</span>
            </div>
          </div>
        </sc-for>
        <p style="margin: 10px 0 0; font-size: 12px; color: #566160">Toque em um dia para mudar as horas. As cores mostram quem trabalha dentro do horário da clínica.</p>
      </div>

      <button type="button" style="min-height: 48px; border: 1px solid #7A8584; border-radius: 12px; background: #FFFFFF; font: inherit; font-weight: 600; color: #142625">Editar horário da clínica</button>
    </div>
  </sc-if>

  <!-- CALENDÁRIO -->
  <sc-if value="{{emCal}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="border-radius: 20px; background: #FFFFFF; padding: 14px 12px 12px">
        <div style="display: flex; align-items: center; gap: 4px; padding: 0 4px 8px">
          <button type="button" aria-label="Mês anterior" style="width: 44px; height: 44px; border: 0; background: none; font: inherit; font-size: 18px; cursor: pointer">‹</button>
          <strong style="flex: 1; text-align: center; font-size: 16px; font-weight: 600">Novembro de 2026</strong>
          <button type="button" aria-label="Próximo mês" style="width: 44px; height: 44px; border: 0; background: none; font: inherit; font-size: 18px; cursor: pointer">›</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; color: #566160; padding-bottom: 4px"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{dias}}" as="c" hint-placeholder-count="35">
            <span style="{{c.cel}}"><span style="{{c.num}}">{{c.n}}</span><span style="display: flex; gap: 2px; height: 6px">
              <sc-for list="{{c.marcas}}" as="m" hint-placeholder-count="1"><i style="{{m.style}}"></i></sc-for>
            </span></span>
          </sc-for>
        </div>
        <p style="margin: 10px 4px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: #566160"><span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #B42318; margin-right: 4px"></i>Clínica fechada</span><span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #EBCB94; margin-right: 4px"></i>Lívia</span><span><i style="display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #6B3FD4; margin-right: 4px"></i>Bruna</span></p>
      </div>

      <section aria-labelledby="prox-h" style="border-radius: 16px; background: #FFFFFF; overflow: hidden">
        <h2 id="prox-h" style="margin: 0; padding: 14px 16px 6px; font-size: 16px; font-weight: 600">Próximos</h2>
        <sc-for list="{{proximos}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 16px; border-top: 1px solid #EEEDE7">
            <span style="{{r.avatar}}">{{r.ini}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-weight: 600">{{r.titulo}}</strong><span style="font-size: 12px; color: {{r.corSub}}">{{r.sub}}</span></span>
            <button type="button" aria-label="Remover {{r.titulo}}" style="width: 44px; height: 44px; border: 0; background: none; font: inherit; font-size: 18px; cursor: pointer">×</button>
          </div>
        </sc-for>
      </section>

      <button type="button" style="position: sticky; bottom: 0; min-height: 52px; border: 0; border-radius: 12px; background: #0E5A5C; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">+ Folga, férias ou fechamento</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}
    const aba = s.aba || 'semana'
    const sel = s.sel || []
    const P = [
      { id: 'paula', nome: 'Dra. Paula', cor: '#0E5A5C' },
      { id: 'bruna', nome: 'Bruna', cor: '#6B3FD4' },
      { id: 'livia', nome: 'Lívia', cor: '#EBCB94' },
    ]
    const tab = (on) => 'min-height: 40px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #142625; font-weight: 600; box-shadow: 0 1px 3px rgba(20,38,37,0.15);' : 'background: none; color: #424B4A;')
    const filtros = [{ id: 'todos', nome: 'Clínica' }, ...P].map((f) => {
      const on = f.id === 'todos' ? sel.length === 0 : sel.includes(f.id)
      const cor = f.id === 'todos' ? '#142625' : f.cor
      return {
        nome: f.nome, on,
        pick: () => this.setState({ sel: f.id === 'todos' ? [] : (on ? sel.filter((x) => x !== f.id) : [...sel, f.id]) }),
        style: 'flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; ' + (on ? 'border: 1px solid #142625; background: #FFFFFF; font-weight: 600; color: #142625;' : 'border: 1px solid #E1E3E0; background: #FFFFFF; color: #424B4A;'),
        dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + cor,
      }
    })
    // 08h–20h = 12 h; posição em %
    const pos = (h) => ((h - 8) / 12) * 100
    const dias = [['Seg', 8, 18], ['Ter', 8, 18], ['Qua', 8, 18], ['Qui', 8, 18], ['Sex', 8, 18], ['Sáb', 8, 13], ['Dom', 0, 0]]
    const linhas = dias.map(([nome, a, b], i) => {
      const aberto = b > 0
      const pessoas = P.filter((p) => sel.includes(p.id)).map((p, k) => {
        // Lívia só seg–qua 09–17 (horário próprio); as outras seguem a clínica
        let ini = a, fim = b
        if (p.id === 'livia') { if (i > 2) return null; ini = 9; fim = 17 }
        if (!aberto) return null
        const n = sel.length
        const h = 100 / n
        return { style: 'position: absolute; left: ' + pos(ini) + '%; width: ' + (pos(fim) - pos(ini)) + '%; top: ' + (k * h) + '%; height: ' + h + '%; background: ' + p.cor + '; border-radius: 8px; opacity: 0.9' }
      }).filter(Boolean)
      return {
        nome, pessoas,
        clinica: aberto ? 'position: absolute; top: 0; bottom: 0; left: ' + pos(a) + '%; width: ' + (pos(b) - pos(a)) + '%; border-radius: 8px; background: ' + (sel.length ? '#E7F1F1' : '#0E5A5C') : 'display: none',
        fechado: aberto ? 'display: none' : 'position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: #566160',
      }
    })
    // calendário nov/2026 (1/11 = domingo): 35 células começando na segunda 26/10
    const marc = { 10: 'livia', 11: 'livia', 12: 'livia', 13: 'livia', 14: 'livia', 15: 'clinica', 16: 'livia', 17: 'livia', 18: 'livia', 19: 'livia', 20: 'livia', 24: 'bruna' }
    const cor = { clinica: '#B42318', livia: '#EBCB94', bruna: '#6B3FD4' }
    const cells = []
    for (let k = 0; k < 35; k += 1) {
      const day = k - 5 // 26/10 → k=0 → day=-5
      const fora = day < 1 || day > 30
      const real = fora ? (day < 1 ? 31 + day : day - 30) : day
      const m = fora ? null : marc[day]
      const hoje = day === 5
      cells.push({
        n: real,
        marcas: m ? [{ style: 'flex: 1; border-radius: 3px; background: ' + cor[m] }] : [],
        cel: 'display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border-radius: 8px; ' + (hoje ? 'background: #E7F1F1;' : ''),
        num: 'font-size: 14px; ' + (fora ? 'color: #7A8584;' : hoje ? 'font-weight: 600; color: #0A4547;' : 'color: #142625;'),
      })
    }
    const proximos = [
      { ini: 'LI', titulo: 'Lívia · Férias', sub: '10/11 – 20/11 · 3 horários marcados', corSub: '#6E4200', avatar: 'width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; background: #FFF7EA; color: #6E4200' },
      { ini: '·', titulo: 'Clínica fechada · Feriado', sub: '15/11 · nenhum horário marcado', corSub: '#566160', avatar: 'width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; background: #FDF1F0; color: #B42318' },
      { ini: 'BR', titulo: 'Bruna · Folga', sub: '24/11 · dia inteiro', corSub: '#566160', avatar: 'width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; background: #E7E0F8; color: #4B2A9E' },
    ]
    return {
      emSemana: aba === 'semana', emCal: aba === 'cal',
      tabSemana: tab(aba === 'semana'), tabCal: tab(aba === 'cal'),
      verSemana: () => this.setState({ aba: 'semana' }), verCal: () => this.setState({ aba: 'cal' }),
      filtros, linhas, dias: cells, proximos,
    }
  }
}
</script>
</body>
</html>
