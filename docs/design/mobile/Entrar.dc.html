<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A5C}a:hover{color:#0A4547}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0E5A5C;outline-offset:2px}
</style>
</helmet>
<!--
  M-09 Entrar — composição Proposta 31/10/2026 (revisão Paulo).
  Corrige o splash partido em staging: marca colada no topo, meio vazio,
  «Sem convite?» colado no fundo. Aqui marca + formulário Clerk (mock) +
  nota de convite formam um único bloco centrado no eixo vertical.
  Fundo: surface.app com mancha suave primary.tint (tokens), sem branco plano.
  DEC-070: logotipo horizontal acima do formulário. Sem features novas.
-->
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F4EF; color: #142625; font-family: Roboto, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; padding: 0 24px 34px">

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(120% 70% at 50% 28%, #E7F1F1 0%, rgba(231,241,241,0) 62%),
  radial-gradient(90% 50% at 50% 100%, #EEEDE7 0%, rgba(238,237,231,0) 55%),
  #F5F4EF"></div>

<div style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; min-height: 0">

<div style="display: flex; justify-content: center">
<img src="../brand/svg/tredane-horizontal-cor.svg" alt="Tredane" height="48" style="height: 48px; width: auto; display: block">
</div>

<sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Entrar</h1>
<p style="margin: 0; color: #424B4A">Use o e-mail do seu convite. Enviaremos um código de 6 dígitos.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #424B4A; text-align: left">E-mail
<input type="email" autocomplete="email" placeholder="nome@clinica.com.br" style="height: 36px; box-sizing: border-box; padding: 0 16px; border: 1px solid #7A8584; border-radius: 8px; font-size: 14px; color: #142625; background: #FFFFFF"></label>
<button type="button" onClick="{{goCode}}" style="height: 36px; border: 0; border-radius: 8px; background: #0E5A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Continuar</button>
</div>
</sc-if>

<sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Digite o código</h1>
<p style="margin: 0; color: #424B4A">Enviamos um código para a***@clinica.com.br. Ele vale por poucos minutos.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #424B4A; text-align: left">Código de 6 dígitos
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="height: 60px; box-sizing: border-box; padding: 0 16px; border: 1px solid #7A8584; border-radius: 8px; font-size: 22px; letter-spacing: .4em; text-align: center; color: #142625; background: #FFFFFF"></label>
<a href="Clinicas.dc.html" style="display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 8px; background: #0E5A5C; color: #FFFFFF; font-weight: 600; text-decoration: none">Entrar</a>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
<button type="button" onClick="{{goEmail}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #0A4547; font-weight: 500; text-decoration: underline; cursor: pointer">Usar outro e-mail</button>
<span style="color: #566160">Reenviar código em 0:24</span>
</div>
</div>
</sc-if>

<p style="margin: 0; font-size: 13px; color: #566160; text-align: center">Sem convite? Peça ao responsável da sua clínica.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const step = (this.state && this.state.step) || 'email';
return {
isEmail: step === 'email',
isCode: step === 'code',
goCode: () => this.setState({ step: 'code' }),
goEmail: () => this.setState({ step: 'email' })
};
}
}
</script>
</body>
</html>
