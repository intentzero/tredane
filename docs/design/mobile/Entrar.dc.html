<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E43A8}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2F5BD3;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1C1E21; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; padding: 0 24px 34px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding-top: 56px">
<div style="width: 36px; height: 36px; border-radius: 8px; background: #1C1E21; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600">T</div>
<span style="font-size: 20px; font-weight: 600">Tredane</span>
</div>

<sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600">Entrar</h1>
<p style="margin: 0; color: #474C54">Use o e-mail do seu convite. Enviaremos um código de 6 dígitos.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #474C54">E-mail
<input type="email" autocomplete="email" placeholder="nome@clinica.com.br" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CDD0D4; border-radius: 12px; font-size: 16px; color: #1C1E21"></label>
<button type="button" onClick="{{goCode}}" style="height: 52px; border: 0; border-radius: 12px; background: #2F5BD3; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Continuar</button>
</div>
</sc-if>

<sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600">Digite o código</h1>
<p style="margin: 0; color: #474C54">Enviamos um código para a***@clinica.com.br. Ele vale por poucos minutos.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #474C54">Código de 6 dígitos
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="height: 60px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CDD0D4; border-radius: 12px; font-size: 28px; letter-spacing: .4em; text-align: center; color: #1C1E21"></label>
<a href="Clinicas.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #2F5BD3; color: #FFFFFF; font-weight: 600; text-decoration: none">Entrar</a>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
<button type="button" onClick="{{goEmail}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #1E43A8; font-weight: 500; text-decoration: underline; cursor: pointer">Usar outro e-mail</button>
<span style="color: #5B616B">Reenviar código em 0:24</span>
</div>
</div>
</sc-if>

<p style="margin: 0; font-size: 13px; color: #5B616B; text-align: center">Sem convite? Peça ao responsável da sua clínica.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const step = (this.state && this.state.step) || 'email';
return {
isEmail: step === 'email',
isCode: step === 'code',
goCode: () => this.setState({ step: 'code' }),
goEmail: () => this.setState({ step: 'email' })
};
}
}
</script>
</body>
</html>
