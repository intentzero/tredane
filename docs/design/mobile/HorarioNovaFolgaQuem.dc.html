<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folga — escolher quem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0E5A5C}a:hover{color:#0A4547}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #142625">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20, 38, 37, 0.45)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="folga-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 4px; background: #CBD0CF; margin: 8px auto 0"></div>
    <header style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 4px 20px">
      <h2 id="folga-h" style="margin: 0; flex: 1; font-size: 18px; font-weight: 600">Folga ou fechamento</h2>
      <a href="HorarioNovaFolga.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #424B4A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </header>

    <div style="flex: 1; padding: 8px 20px 20px; position: relative">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="quem-l" style="font-size: 14px; font-weight: 600; color: #424B4A">Quem fica fora</span>
        <div style="min-height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 2px solid #0E5A5C; border-radius: 12px; background: #FFFFFF">
          <span style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px">
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: #E6F2EA; color: #24603D; font-size: 14px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #2F7D4F"></span>Lívia</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; background: #FBEDE3; color: #8A3410; font-size: 14px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #C2410C"></span>Tiago</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
        </div>
      </div>

      <div role="listbox" aria-multiselectable="true" aria-labelledby="quem-l" style="margin-top: 6px; background: #FFFFFF; border: 1px solid #E1E3E0; border-radius: 12px; box-shadow: 0 12px 28px rgba(20, 38, 37, 0.16); overflow: hidden">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
          <div role="option" aria-selected="{{o.on}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: {{o.border}}; background: {{o.bg}}">
            <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 8px; border: {{o.box}}; background: {{o.boxBg}}; display: flex; align-items: center; justify-content: center; flex: none">
              <sc-if value="{{o.checked}}" hint-placeholder-val="{{ false }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>
              </sc-if>
            </span>
            <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: {{o.dot}}; flex: none"></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; font-weight: 600">{{o.label}}</span>
              <span style="font-size: 12px; color: #566160">{{o.hint}}</span>
            </span>
          </div>
        </sc-for>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 16px; border-top: 1px solid #E1E3E0; background: #F5F4EF">
          <span style="font-size: 14px; color: #424B4A">2 selecionadas</span>
          <a href="HorarioNovaFolga.dc.html" style="height: 44px; padding: 0 20px; border-radius: 8px; background: #0E5A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Concluir</a>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = [
      { label: 'Clínica inteira', hint: 'Ninguém agenda; desmarca as pessoas', dot: '#B42318', on: false },
      { label: 'Paula', hint: 'Segue o horário da clínica', dot: '#2563A8', on: false },
      { label: 'Tiago', hint: 'Segue o horário da clínica', dot: '#C2410C', on: true },
      { label: 'Lívia', hint: 'Horário próprio', dot: '#2F7D4F', on: true }
    ];
    const opts = base.map((o, i) => ({
      ...o,
      checked: o.on,
      on: o.on ? 'true' : 'false',
      border: i === 0 ? '0' : (i === 1 ? '1px solid #CBD0CF' : '1px solid #EEEDE7'),
      bg: o.on ? '#E7F1F1' : '#FFFFFF',
      box: o.on ? '2px solid #0E5A5C' : '2px solid #7A8584',
      boxBg: o.on ? '#0E5A5C' : '#FFFFFF'
    }));
    return { opts };
  }
}
</script>
</body>
</html>
