<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px">

<section aria-label="Sugestões com IA" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #F7F4FD; border: 1px solid #E7E0F8; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 12px">

<span style="font-size: 16px; font-weight: 600; color: #4B2A9E">Sugestões com IA</span>
<span style="font-size: 13px; color: #424B4A">A IA prepara um rascunho a cada mensagem. A equipe revisa antes de enviar.</span>
</label>
<button id="ia" role="switch" aria-checked="false" style="width: 52px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; flex: none">
<span style="width: 52px; height: 30px; border-radius: 999px; background: #7A8584; display: flex; align-items: center; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF"></span></span>
</button>
</div>
<button aria-expanded="false" style="align-self: flex-start; min-height: 44px; margin: -6px 0 -10px; padding: 0; border: 0; background: none; color: #4B2A9E; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px">
Como funciona e o que acontece com as mensagens
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
</button>
</section>

<section aria-label="Marcação pela cliente" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E1E3E0; border-radius: 12px">
<label for="marca" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600">A cliente confirma o horário no WhatsApp</span>
<span style="font-size: 13px; color: #566160">Só marca quando ela toca no botão da proposta. Mudar e cancelar continuam com a equipe.</span>
</label>
<button id="marca" role="switch" aria-checked="false" disabled style="width: 52px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; flex: none">
<span style="width: 52px; height: 30px; border-radius: 999px; background: #CBD0CF; display: flex; align-items: center; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF"></span></span>
</button>
</section>

<section aria-label="Proteções" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E1E3E0; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #EEEDE7">
<label for="lim" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600">Limites de proteção</span>
<span style="font-size: 13px; color: #566160">Evita que a IA crie rascunhos, propostas ou marcações em excesso. Não afeta o que a equipe faz à mão.</span>
</label>
<button id="lim" role="switch" aria-checked="true" style="width: 52px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; flex: none">
<span style="width: 52px; height: 30px; border-radius: 999px; background: #0E5A5C; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF"></span></span>
</button>
</div>
<button style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 14px; border: 0; border-bottom: 1px solid #EEEDE7; background: none; text-align: left; color: inherit; font-size: 14px">
<span style="flex: 1">Valores recomendados em uso</span>
<span style="color: #0E5A5C; font-weight: 500">Personalizar</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
</button>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px">
<label for="pausa" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600">Pausar marcações automáticas</span>
<span style="font-size: 13px; color: #566160">Vale só para esta clínica. Horários já marcados continuam.</span>
</label>
<button id="pausa" role="switch" aria-checked="false" style="width: 52px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; flex: none">
<span style="width: 52px; height: 30px; border-radius: 999px; background: #7A8584; display: flex; align-items: center; padding: 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF"></span></span>
</button>
</div>
</section>

<section aria-label="Local para a previsão do tempo" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E1E3E0; border-radius: 12px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 8px 8px 14px; border: 0; background: none; text-align: left; color: inherit; font-size: 14px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600">Cidade para a previsão do tempo</span>
<span style="font-size: 13px; color: #566160">Não definida · só para serviços que dependem do tempo</span>
</span>
<span style="color: #0E5A5C; font-weight: 500">Definir</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
</button>
</section>

<p style="margin: 0 4px; font-size: 13px; color: #566160">Cada interruptor salva ao tocar e mostra «Salvo» por um instante.</p>
