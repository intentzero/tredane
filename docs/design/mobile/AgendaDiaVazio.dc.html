<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agenda · Dia sem horários</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
button{font-family:inherit}
button:focus-visible{outline:2px solid #0E5A5C;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F5F4EF;color:#142625;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;font-size: 14px;line-height:1.35;overflow:hidden">

<header style="background:#FFFFFF;border-bottom:1px solid #E1E3E0;padding:12px 16px;display:flex;align-items:center;gap:8px">
<h1 style="margin:0;font-size: 18px;font-weight:600;flex:1">Agenda</h1>
<div role="group" aria-label="Visão" style="display:flex;background:#EEEDE7;border-radius: 8px;padding:2px">
<button aria-pressed="true" style="height:32px;padding:0 14px;border:0;border-radius: 6px;background:#FFFFFF;color:#0A4547;font-size: 13px;font-weight:500;box-shadow:0 0 0 1px #B3D1D1 inset">Dia</button>
<button aria-pressed="false" style="height:32px;padding:0 14px;border:0;border-radius: 6px;background:transparent;color:#424B4A;font-size: 13px;font-weight:500">Semana</button>
</div>
</header>

<div style="padding:16px;display:flex;flex-direction:column;gap:16px;flex:1">
<div style="font-size: 16px;font-weight:600">Segunda, 3 de novembro</div>

<div style="background:#FFFFFF;border:1px solid #E1E3E0;border-radius: 12px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
<div style="width:56px;height:56px;border-radius: 999px;background:#E7F1F1;color:#0A4547;display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
</div>
<h2 style="margin:4px 0 0;font-size: 16px;font-weight:600">Nenhum horário marcado</h2>
<p style="margin:0;font-size: 13px;color:#566160;max-width:280px">Paula e Lívia atendem das 09:00 às 18:00. O dia todo está livre.</p>
</div>

<section aria-label="Primeiros horários livres" style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:0;font-size: 13px;font-weight:500;color:#424B4A">Primeiros horários livres</h2>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button style="height:44px;border:1px solid #7A8584;border-radius: 8px;background:#FFFFFF;color:#142625;font-size: 14px;font-weight:500">09:00</button>
<button style="height:44px;border:1px solid #7A8584;border-radius: 8px;background:#FFFFFF;color:#142625;font-size: 14px;font-weight:500">09:30</button>
<button style="height:44px;border:1px solid #7A8584;border-radius: 8px;background:#FFFFFF;color:#142625;font-size: 14px;font-weight:500">10:00</button>
</div>
<p style="margin:0;font-size: 13px;color:#566160">Tocar num horário abre o Agendar já neste dia e hora.</p>
</section>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px">
<button style="height:48px;border:0;border-radius: 12px;background:#0E5A5C;color:#FFFFFF;font-size: 14px;font-weight:600">Agendar segunda</button>
<button style="height:44px;border:0;border-radius: 12px;background:transparent;color:#0A4547;font-size: 14px;font-weight:500">Ir para hoje</button>
</div>
</div>

<nav aria-label="Principal" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #E1E3E0;padding:4px 0 18px">
<div style="height:44px;display:flex;align-items:center;justify-content:center;font-size: 11px;color:#566160">Conversas</div>
<div style="height:44px;display:flex;align-items:center;justify-content:center;font-size: 11px;color:#566160">Funil</div>
<div style="height:44px;display:flex;align-items:center;justify-content:center;font-size: 11px;font-weight:600;color:#0A4547">Agenda</div>
<div style="height:44px;display:flex;align-items:center;justify-content:center;font-size: 11px;color:#566160">Clínica</div>
</nav>
</div>
