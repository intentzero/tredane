<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar quarta-feira</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0E5A5C}a:hover{color:#0A4547}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F4EF; font-family: Inter, system-ui, sans-serif; color: #142625">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20, 38, 37, 0.45)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="dia-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; max-height: 780px">
    <div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 4px; background: #CBD0CF; margin: 8px auto 0"></div>
    <header style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 4px 20px">
      <h2 id="dia-h" style="margin: 0; flex: 1; font-size: 16px; font-weight: 600">Quarta-feira</h2>
      <a href="Horarios.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #424B4A">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </header>

    <div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 20px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 36px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">Aberta neste dia</span>
          <span style="font-size: 13px; color: #566160">Desligado, ninguém agenda na quarta.</span>
        </span>
        <span style="position: relative; width: 52px; height: 32px; flex: none">
          <input type="checkbox" role="switch" checked="checked" aria-label="Aberta na quarta-feira" style="position: absolute; inset: 0; opacity: 0; margin: 0">
          <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 999px; background: #0E5A5C"></span>
          <span aria-hidden="true" style="position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span>
        </span>
      </label>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #424B4A">Faixas de atendimento</h3>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; color: #424B4A">Começa</span>
            <input type="time" step="900" value="08:00" aria-label="Faixa 1, começa" style="height: 36px; box-sizing: border-box; border: 1px solid #7A8584; border-radius: 8px; padding: 0 12px; font-size: 14px; color: #142625; background: #FFFFFF">
          </label>
          <span aria-hidden="true" style="align-self: end; height: 36px; display: flex; align-items: center; justify-content: center; color: #566160">–</span>
          <label style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; color: #424B4A">Termina</span>
            <input type="time" step="900" value="12:00" aria-label="Faixa 1, termina" style="height: 36px; box-sizing: border-box; border: 1px solid #7A8584; border-radius: 8px; padding: 0 12px; font-size: 14px; color: #142625; background: #FFFFFF">
          </label>
          <button type="button" aria-label="Remover faixa 1" style="align-self: end; width: 44px; height: 36px; border: 0; background: transparent; color: #424B4A; border-radius: 8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px; font-size: 13px; color: #566160">
          <span aria-hidden="true" style="flex: 1; height: 1px; background: #E1E3E0"></span>
          Intervalo de 1 h
          <span aria-hidden="true" style="flex: 1; height: 1px; background: #E1E3E0"></span>
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 44px; align-items: center; gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; color: #424B4A">Começa</span>
            <input type="time" step="900" value="13:00" aria-label="Faixa 2, começa" style="height: 36px; box-sizing: border-box; border: 1px solid #7A8584; border-radius: 8px; padding: 0 12px; font-size: 14px; color: #142625; background: #FFFFFF">
          </label>
          <span aria-hidden="true" style="align-self: end; height: 36px; display: flex; align-items: center; justify-content: center; color: #566160">–</span>
          <label style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; color: #424B4A">Termina</span>
            <input type="time" step="900" value="20:00" aria-label="Faixa 2, termina" style="height: 36px; box-sizing: border-box; border: 2px solid #0E5A5C; border-radius: 8px; padding: 0 11px; font-size: 14px; color: #142625; background: #FFFFFF">
          </label>
          <button type="button" aria-label="Remover faixa 2" style="align-self: end; width: 44px; height: 36px; border: 0; background: transparent; color: #424B4A; border-radius: 8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
          </button>
        </div>

        <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #0E5A5C; font-size: 13px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Adicionar faixa
        </button>

        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px">
          <span style="position: relative; height: 10px; border-radius: 4px; background: #EEEDE7">
            <span style="position: absolute; top: 0; bottom: 0; left: 7.69%; width: 30.77%; background: #0E5A5C; border-radius: 4px"></span>
            <span style="position: absolute; top: 0; bottom: 0; left: 46.15%; width: 53.85%; background: #0E5A5C; border-radius: 4px"></span>
          </span>
          <span style="display: flex; justify-content: space-between; font-size: 11px; color: #566160"><span>07h</span><span>11h</span><span>15h</span><span>20h</span></span>
        </div>
      </div>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #424B4A">Usar este horário também em</legend>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
            <button type="button" aria-pressed="{{c.on}}" aria-label="{{c.full}}" disabled="{{c.disabled}}" style="height: 44px; border-radius: 8px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 600; padding: 0">{{c.short}}</button>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 13px; color: #566160; line-height: 1.4">Quinta passa a ter 08:00–12:00 e 13:00–20:00.</p>
      </fieldset>
    </div>

    <footer style="display: flex; gap: 8px; padding: 12px 20px 20px; border-top: 1px solid #EEEDE7">
      <a href="Horarios.dc.html" style="flex: 1; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #7A8584; color: #142625; font-size: 14px; font-weight: 600; text-decoration: none">Cancelar</a>
      <a href="Horarios.dc.html" style="flex: 2; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #0E5A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Aplicar a 2 dias</a>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [['Seg', 'Segunda'], ['Ter', 'Terça'], ['Qua', 'Quarta (este dia)'], ['Qui', 'Quinta'], ['Sex', 'Sexta'], ['Sáb', 'Sábado'], ['Dom', 'Domingo']];
    const chips = days.map(([short, full], i) => {
      const self = i === 2, on = i === 3;
      return {
        short, full,
        on: self || on ? 'true' : 'false',
        disabled: self,
        border: self ? '1px solid #B3D1D1' : on ? '2px solid #0E5A5C' : '1px solid #7A8584',
        bg: self ? '#E7F1F1' : on ? '#E7F1F1' : '#FFFFFF',
        fg: self ? '#0A4547' : on ? '#0A4547' : '#142625'
      };
    });
    return { chips };
  }
}
</script>
</body>
</html>
