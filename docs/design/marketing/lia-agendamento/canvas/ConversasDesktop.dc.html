<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conversas — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="display: flex; width: 1440px; height: 960px; box-sizing: border-box; overflow: hidden; background: #FBF9FF; font-family: Roboto, system-ui, sans-serif; color: #211339">

  <nav aria-label="Áreas" style="flex: none; width: 96px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #DFD5EF; display: flex; flex-direction: column; align-items: center; padding: 20px 8px 20px">
    <svg aria-hidden="true" width="44" height="44" viewBox="0 0 64 64" style="flex: none; display: block"><rect width="64" height="64" rx="14" fill="#211339"></rect><g transform="translate(8.960 9.140) scale(0.72)"><path d="M13 24H22A10 10 0 0 1 32 34V54M51 24H42A10 10 0 0 0 32 34" fill="none" stroke="#F1ECFA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="32" cy="10" r="5.5" fill="#D5FF55"></circle></g></svg>
    <div style="margin-top: 20px; width: 100%; display: flex; flex-direction: column; gap: 4px">
      <a href="#" aria-current="page" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; background: #EDE4FF; color: #4C259E; font-size: 11px; font-weight: 600; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></svg>Conversas</a>
      <a href="#" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; color: #6A5A7A; font-size: 11px; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v14"></path><path d="M12 3v8"></path><path d="M19 3v18"></path></svg>Acompanhar</a>
      <a href="#" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; color: #6A5A7A; font-size: 11px; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Agenda</a>
      <a href="#" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; color: #6A5A7A; font-size: 11px; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>Clientes</a>
      <a href="#" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; color: #6A5A7A; font-size: 11px; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>Clínica</a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <button type="button" aria-label="Avisos" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #6A5A7A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 999px; background: #B42318; border: 2px solid #FFFFFF"></span>
      </button>
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: #EDE4FF; color: #4C259E; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">AV</span>
    </div>
  </nav>

  <section aria-label="Lista de conversas" style="flex: none; width: 440px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #DFD5EF; display: flex; flex-direction: column">
    <header style="flex: none; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Conversas</h1>
      <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #DFD5EF; border-radius: 12px; background: #FBF9FF; color: #6A5A7A; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        Buscar nome ou telefone
      </div>
      <div role="toolbar" aria-label="Filtros" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{ f.on }}" style="{{ f.style }}">{{ f.label }}<sc-if value="{{ f.count }}" hint-placeholder-val="{{ false }}"><span style="{{ f.countStyle }}">{{ f.count }}</span></sc-if></button>
        </sc-for>
      </div>
    </header>
    <ul style="flex: 1 1 auto; overflow: hidden; list-style: none; margin: 0; padding: 0; border-top: 1px solid #DFD5EF">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
        <sc-if value="{{ r.isHead }}" hint-placeholder-val="{{ false }}">
          <li style="padding: 14px 20px 6px; font-size: 13px; font-weight: 600; color: #544364; background: #FBF9FF">{{ r.label }}</li>
        </sc-if>
        <sc-if value="{{ r.isRow }}" hint-placeholder-val="{{ true }}">
          <li style="border-bottom: 1px solid #EFE9F7">
            <button type="button" style="display: flex; align-items: flex-start; gap: 12px; width: 100%; box-sizing: border-box; padding: 12px 20px; border: 0; background: transparent; text-align: left; color: inherit; min-height: 72px; cursor: pointer">
              <span aria-hidden="true" style="{{ r.avStyle }}">{{ r.ini }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
                  <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</span>
                  <span style="{{ r.timeStyle }}">{{ r.time }}</span>
                </span>
                <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="font-size: 14px; color: #544364; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.preview }}</span>
                  <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ false }}"><span style="flex: none; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #4C259E; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ r.unread }}</span></sc-if>
                </span>
                <sc-if value="{{ r.needs }}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; margin-top: 2px; padding: 2px 10px; border-radius: 999px; background: #FBF0DA; color: #7A4A0A; font-size: 12px; font-weight: 600">Precisa de alguém</span></sc-if>
              </span>
            </button>
          </li>
        </sc-if>
      </sc-for>
    </ul>
  </section>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 32px">
    <div style="max-width: 420px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 999px; background: #EDE4FF; color: #4C259E; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></svg>
      </span>
      <h2 style="margin: 0; font-size: 22px; font-weight: 700">Escolha uma conversa</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #544364">2 clientes precisam de alguém agora. As outras conversas estão a ser atendidas pela IA.</p>
      <button type="button" style="margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: #4C259E; color: #FFFFFF; font-size: 15px; font-weight: 600">Abrir a mais antiga</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = [['#EDE4FF', '#4C259E'], ['#E1F2EE', '#14574B'], ['#FBF0DA', '#7A4A0A'], ['#FDE7E2', '#8A2C1E'], ['#E4ECFA', '#1F4A8A']];
    const initials = (n) => n.split(' ').slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const data = [
      { head: 'Precisam de alguém' },
      { name: 'Carla Menezes', time: 'há 12 min', preview: 'Consegue remarcar para sábado?', unread: 2, needs: true, wait: true },
      { name: 'Tatiane Souza', time: 'há 4 min', preview: 'Posso levar uma amiga?', unread: 1, needs: true, wait: true },
      { head: 'Hoje' },
      { name: 'Lia', time: '09:40', preview: 'IA: Pronto, Lia! Limpeza de pele marcada…' },
      { name: 'Beatriz Costa', time: '09:36', preview: 'Obrigada! Até amanhã.' },
      { name: 'Renata Alves', time: '09:30', preview: 'Sinal recebido por Pix' },
      { name: 'Camila Duarte', time: '09:24', preview: 'IA: Marcação confirmada: sexta, 16:45' },
      { name: 'Juliana Pires', time: '09:10', preview: 'Quanto custa a drenagem linfática?', unread: 1 },
      { name: 'Fernanda Lima', time: '08:52', preview: 'Confirmo presença!' },
      { head: 'Ontem' },
      { name: 'Patrícia Dias', time: 'ontem', preview: 'Bom dia! Tem vaga hoje?' },
      { name: 'Larissa Gomes', time: 'ontem', preview: 'Obrigada pelo atendimento!' },
      { name: 'Helena Rocha', time: 'ontem', preview: 'IA: Marcação confirmada: sexta, 13:00' },
    ];
    let k = 0;
    const rows = data.map((d) => {
      if (d.head) return { isHead: true, isRow: false, label: d.head };
      const t = tones[k % tones.length]; k += 1;
      return {
        isHead: false, isRow: true, name: d.name, time: d.time, preview: d.preview, unread: d.unread ? String(d.unread) : '', needs: !!d.needs, ini: initials(d.name),
        avStyle: 'flex: none; width: 44px; height: 44px; border-radius: 999px; background: ' + t[0] + '; color: ' + t[1] + '; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center',
        timeStyle: 'flex: none; font-size: 12px; white-space: nowrap; ' + (d.wait ? 'color: #7A4A0A; font-weight: 600' : 'color: #6A5A7A'),
      };
    });
    const fl = [['Todas', true, ''], ['Precisam de alguém', false, '2'], ['Novas', false, ''], ['Minhas', false, ''], ['Sem responsável', false, ''], ['Fechadas', false, '']];
    const filters = fl.map(([label, on, count]) => ({
      label, on, count,
      style: 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; ' + (on ? 'background: #EDE4FF; border: 2px solid #5C32C9; color: #4C259E; padding: 0 13px' : 'background: #FFFFFF; border: 1px solid #8E7FA8; color: #211339'),
      countStyle: 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #FBF0DA; color: #7A4A0A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center',
    }));
    return { rows, filters };
  }
}
</script>
</body>
</html>
