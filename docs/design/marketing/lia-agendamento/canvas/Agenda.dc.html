</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FBF9FF; font-family: Roboto, system-ui, sans-serif; color: #211339; display: flex; flex-direction: column">

      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.3 0 4.4.9 6 2.4l.9-.9A10.4 10.4 0 0 0 8.5 1 10.4 10.4 0 0 0 1.6 3.9l.9.9a8.7 8.7 0 0 1 6-2.4z"></path><path d="M8.5 5.9c1.4 0 2.6.5 3.6 1.4l.9-.9a7.3 7.3 0 0 0-9 0l.9.9c1-.9 2.2-1.4 3.6-1.4z"></path><path d="M8.5 9.3c.6 0 1.2.2 1.6.6L8.5 11.5 6.9 9.9c.4-.4 1-.6 1.6-.6z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" opacity="0.45"></rect><rect x="2" y="2" width="19" height="9" rx="2.2" fill="currentColor"></rect><path d="M24 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity="0.5"></path></svg>

  <div aria-hidden="true" style="flex: none; height: 54px; background: #FFFFFF"></div>
  <header style="flex: none; background: #FFFFFF; border-bottom: 1px solid #DFD5EF; padding: 16px 16px 12px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Agenda</h1>
      <button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #B9A2F0; border-radius: 999px; background: #FFFFFF; color: #4C259E; font-size: 14px; font-weight: 600">Hoje</button>
    </div>
    <div style="margin: 4px -8px 0 -8px; display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Dia anterior" style="width: 44px; height: 44px; border: 0; background: transparent; color: #211339; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <div style="text-align: center">
        <div style="font-size: 16px; font-weight: 600">Sexta, 27 de novembro</div>
        <div style="font-size: 13px; color: #544364">amanhã · 27 marcações</div>
      </div>
      <button type="button" aria-label="Dia seguinte" style="width: 44px; height: 44px; border: 0; background: transparent; color: #211339; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </header>

  <main ref="{{ listRef }}" role="list" aria-label="Marcações de sexta, 27 de novembro" style="flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <sc-if value="{{ r.isGap }}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 4px 0">
          <span style="font-size: 13px; font-weight: 600; color: #544364; font-variant-numeric: tabular-nums; width: 44px">{{ r.time }}</span>
          <span style="flex: 1; height: 1px; background: #DFD5EF"></span>
          <span style="font-size: 13px; color: #544364">{{ r.label }}</span>
        </div>
      </sc-if>
      <sc-if value="{{ r.isApt }}" hint-placeholder-val="{{ true }}">
        <div role="listitem" data-t="{{ r.time }}" style="{{ r.cardStyle }}">
          <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 12px; border: 0; background: transparent; text-align: left; color: inherit; min-height: 64px">
            <span aria-hidden="true" style="{{ r.avStyle }}">{{ r.ini }}</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-variant-numeric: tabular-nums">{{ r.time }}</span> {{ r.name }}</span>
                <sc-if value="{{ r.isNew }}" hint-placeholder-val="{{ false }}">
                  <span style="flex: none; padding: 2px 8px; border-radius: 999px; background: #D5FF55; color: #211339; font-size: 11px; font-weight: 700">Novo</span>
                </sc-if>
              </span>
              <span style="font-size: 13px; color: #544364; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.line }}</span>
            </span>
          </button>
        </div>
      </sc-if>
    </sc-for>
  </main>

  <nav aria-label="Áreas" style="flex: none; background: #FFFFFF; border-top: 1px solid #DFD5EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 24px">
    <a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6A5A7A; font-size: 11px; font-weight: 400; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path></svg>
      Conversas
    </a>
    <a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6A5A7A; font-size: 11px; font-weight: 400; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v14"></path><path d="M12 3v8"></path><path d="M19 3v18"></path></svg>
      Acompanhar
    </a>
    <a href="#" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4C259E; font-size: 11px; font-weight: 600; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
      Agenda
    </a>
    <a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6A5A7A; font-size: 11px; font-weight: 400; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
      Clientes
    </a>
    <a href="#" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6A5A7A; font-size: 11px; font-weight: 400; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg>
      Clínica
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.listRef = (el) => { this.list = el; };
  }
  componentDidMount() {
    setTimeout(() => {
      const el = this.list && this.list.querySelector('[data-t="14:30"]');
      if (el) this.list.scrollTop = Math.max(0, el.offsetTop - 16 - this.list.offsetTop);
    }, 0);
  }
  renderVals() {
    const tone = ['#5C32C9', '#3E8C7C', '#B7791F'];
    const avBg = ['#EDE4FF', '#E1F2EE', '#FBF0DA'];
    const avInk = ['#4C259E', '#14574B', '#7A4A0A'];
    const pro = (i) => ({ edge: tone[i], bg: avBg[i], ink: avInk[i] });
    const data = [
      { t: '08:00', name: 'Patrícia Dias', line: 'Massagem relaxante · até 09:00 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '08:30', name: 'Carolina Melo', line: 'Peeling químico · até 09:15 · Consultório', p: 2, ini: 'DP' },
      { t: '09:00', name: 'Fernanda Lima', line: 'Limpeza de pele · até 09:45 · Sala Estética', p: 0, ini: 'AN' },
      { t: '09:00', name: 'Marta Silva', line: 'Drenagem linfática · até 10:00 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '09:30', name: 'Elisa Barros', line: 'Microagulhamento · até 10:15 · Consultório', p: 2, ini: 'DP' },
      { t: '10:15', name: 'Sofia Prado', line: 'Hidratação facial · até 11:00 · Sala Estética', p: 0, ini: 'AN' },
      { t: '10:15', name: 'Cláudia Ramos', line: 'Massagem modeladora · até 11:15 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '10:30', name: 'Paula Reis', line: 'Bioestimulador de colágeno · até 11:30 · Consultório', p: 2, ini: 'DP' },
      { t: '11:30', name: 'Larissa Gomes', line: 'Limpeza de pele · até 12:15 · Sala Estética', p: 0, ini: 'AN' },
      { t: '11:30', name: 'Viviane Cruz', line: 'Massagem relaxante · até 12:30 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '11:45', name: 'Nádia Freitas', line: 'Preenchimento labial · até 12:30 · Consultório', p: 2, ini: 'DP' },
      { t: '13:00', name: 'Helena Rocha', line: 'Massagem facial · até 13:45 · Sala Estética', p: 0, ini: 'AN' },
      { t: '13:00', name: 'Vanessa Cardoso', line: 'Harmonização facial · até 14:00 · Consultório', p: 2, ini: 'DP' },
      { t: '13:30', name: 'Tatiane Souza', line: 'Ventosaterapia · até 14:30 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '14:15', name: 'Mônica Alves', line: 'Toxina botulínica · até 15:00 · Consultório', p: 2, ini: 'DP' },
      { t: '14:30', name: 'Lia', line: 'Limpeza de pele · até 15:15 · Sala Estética', p: 0, ini: 'AN', isNew: true },
      { t: '14:45', name: 'Juliana Pires', line: 'Drenagem linfática · até 15:45 · Sala Massagem', p: 1, ini: 'GI' },
      { t: '15:15', name: 'Bruna Teixeira', line: 'Hidratação facial · até 16:00 · Sala Estética', p: 0, ini: 'AN' },
      { t: '15:15', name: 'Priscila Neves', line: 'Bioestimulador de colágeno · até 16:15 · Consultório', p: 2, ini: 'DP' },
      { t: '16:00', name: 'Beatriz Costa', line: 'Limpeza de pele · até 16:45 · Sala Estética', p: 0, ini: 'AN' },
      { t: '16:30', name: 'Jaqueline Pinto', line: 'Peeling químico · até 17:15 · Consultório', p: 2, ini: 'DP' },

    ];
    const rows = data.map((d) => {
      if (d.gap) return { isGap: true, isApt: false, time: d.t, label: d.label };
      const c = pro(d.p);
      return {
        isGap: false, isApt: true, time: d.t, name: d.name, line: d.line, ini: d.ini, isNew: !!d.isNew,
        cardStyle: 'flex: none; background: #FFFFFF; border: ' + (d.isNew ? '2px solid #5C32C9' : '1px solid #DFD5EF') + '; border-left: 4px solid ' + c.edge + '; border-radius: 12px; overflow: hidden',

    });
    return { rows, listRef: this.listRef };
  }

</script>
