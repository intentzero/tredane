<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conversas desktop — empty (proposta WA)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0E5A5C;outline-offset:2px}
.d{--app:#F5F4EF;--card:#FFFFFF;--sunk:#EEEDE7;--tx:#142625;--tx2:#424B4A;--mu:#566160;--pr:#0E5A5C;--prInk:#0A4547;--prT:#E7F1F1;--prB:#B3D1D1;--ok:#1F7A4D;--okT:#EAF5EF;--wa:#6E4200;--waT:#FFF7EA;--ai:#4B2A9E;--aiAv:#E7E0F8;--ctl:#7A8584;--bd:#E1E3E0;--div:#EEEDE7}
.d button,.d a{color:inherit;cursor:pointer}
.rl a{width:68px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;font-size:11px;color:var(--mu);text-decoration:none}
.rl a.on{background:var(--prT);color:var(--prInk);font-weight:600}
.chip{flex:none;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--ctl);background:var(--card);font-size:13px;color:var(--tx);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--tx);background:var(--tx);color:#FFFFFF;font-weight:600}
.chip .n{font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--tx2);font-variant-numeric:tabular-nums}
.chip.on .n{background:rgba(255,255,255,.2);color:#FFFFFF}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:10px 16px;min-height:60px;box-sizing:border-box;border-bottom:1px solid var(--div);cursor:pointer}
.row:hover{background:var(--app)}
.av{flex:none;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--mu);flex:none}
.sn{font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--mu);margin-top:2px}
.tag{padding:1px 8px;border-radius:6px;font-weight:600}
.tag.ok{background:var(--okT);color:var(--ok)}
.tag.wa{background:var(--waT);color:var(--wa)}
.tag.pr{background:var(--prT);color:var(--prInk)}
</style>
</helmet>
<!--
  Proposta visual desktop TEL-01 (31/10/2026) — densidade e master–detail
  próximos do WhatsApp Web, com rail e tokens Tredane (DEC-041/050/068/070/081).
  Estado: Proposto até o Paulo decidir. Sem implementação de código do painel.
  Viewport: 1440×900. Lista estável 400 px. Empty simples (sem card promo).
-->
<div class="d" style="width:1440px;height:900px;box-sizing:border-box;display:grid;grid-template-columns:84px 400px minmax(0,1fr);background:var(--app);color:var(--tx);font-family:Roboto,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.35;overflow:hidden">

  <nav class="rl" aria-label="Áreas" style="background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0">
    <img src="../brand/svg/tredane-simbolo-cor.svg" alt="" width="40" height="40" style="width:40px;height:40px;margin-bottom:10px;display:block" aria-hidden="true">
    <a class="on" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>Conversas</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16M10 4v6M16 4v16"/></svg>Acompanhar</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Agenda</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Clínica</a>
    <span style="flex:1"></span>
    <button type="button" aria-label="Notificações" style="width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--mu)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    <button type="button" aria-label="Conta de Paulo" style="width:36px;height:36px;border-radius:999px;border:1px solid var(--prB);background:var(--prT);color:var(--prInk);font-weight:600;font-size:13px">P</button>
  </nav>

  <section aria-label="Lista de conversas" style="background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0">
    <div style="padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--bd);flex:none">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em">Conversas</h1>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <button type="button" style="border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--tx2);height:28px;max-width:70%;min-width:0">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Clínica Aurora</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);flex:none"><span style="width:8px;height:8px;border-radius:999px;background:var(--ok)"></span>Ao vivo</span>
      </div>
      <label style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;background:var(--sunk)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566160" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar nesta clínica</span>
        <input type="search" placeholder="Buscar nome ou telefone" style="flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--tx);outline:none">
      </label>
      <div role="group" aria-label="Filtros" style="display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px">
        <button type="button" class="chip on" aria-pressed="true">Todas<span class="n">5</span></button>
        <button type="button" class="chip" aria-pressed="false">Novas<span class="n">1</span></button>
        <button type="button" class="chip" aria-pressed="false">Minhas<span class="n">2</span></button>
        <button type="button" class="chip" aria-pressed="false">Sem responsável<span class="n">1</span></button>
      </div>
    </div>

    <ul style="list-style:none;margin:0;padding:0;overflow-y:auto;flex:1">
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--prT);color:var(--prInk)">MA</span>
          <span class="meta">
            <span class="top"><span class="nm">Marina Alves</span><span class="tm" style="color:var(--prInk);font-weight:600">09:41</span></span>
            <span class="sn" style="color:var(--tx);font-weight:600">Oi! Quanto custa a limpeza de pele?</span>
            <span class="tags"><span class="tag pr">Nova</span><span>Sem responsável</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--aiAv);color:var(--ai)">JP</span>
          <span class="meta">
            <span class="top"><span class="nm">Juliana Prado</span><span class="tm">09:31</span></span>
            <span class="sn">Você: Vou verificar a agenda e já te retorno.</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span>Você · Horário proposto</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:#E7E0F8;color:var(--ai)">PA</span>
          <span class="meta">
            <span class="top"><span class="nm">Paulo</span><span class="tm">55 min</span></span>
            <span class="sn">Obrigado</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span class="tag wa">Precisa de alguém</span><span>Você</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--okT);color:var(--ok)">CM</span>
          <span class="meta">
            <span class="top"><span class="nm">Carla Mendes</span><span class="tm">ontem</span></span>
            <span class="sn">Combinado, até sexta!</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span>Bruno · sex 14:00</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--sunk);color:var(--tx2)">#</span>
          <span class="meta">
            <span class="top"><span class="nm">+55 11 9••••-0042</span><span class="tm">ontem</span></span>
            <span class="sn" style="color:#B42318;font-weight:500">Resposta não enviada</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span>Bruno</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--sunk);color:var(--tx2)">RL</span>
          <span class="meta">
            <span class="top"><span class="nm">Renata Lima</span><span class="tm">20 out</span></span>
            <span class="sn">Obrigada pelo atendimento.</span>
            <span class="tags"><span class="tag" style="background:var(--sunk);color:var(--tx2)">Encerrada</span><span>Ana</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--prT);color:var(--prInk)">BS</span>
          <span class="meta">
            <span class="top"><span class="nm">Beatriz Santos</span><span class="tm">19 out</span></span>
            <span class="sn">Vocês fazem peeling de diamante?</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span>Ana · Em atendimento</span></span>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="row">
          <span class="av" style="background:var(--okT);color:var(--ok)">FO</span>
          <span class="meta">
            <span class="top"><span class="nm">Fernanda Oliveira</span><span class="tm">18 out</span></span>
            <span class="sn">Você: Confirmado para terça às 10h.</span>
            <span class="tags"><span class="tag ok">Em atendimento</span><span>Você · Agendado</span></span>
          </span>
        </button>
      </li>
    </ul>
  </section>

  <section aria-label="Área da conversa" style="min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--app)">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--tx2)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--mu);opacity:.7"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      <h2 style="margin:0;font-size:18px;font-weight:600;color:var(--tx)">Escolha uma conversa</h2>
      <p style="margin:0;max-width:320px;font-size:14px;color:var(--mu)">A lista fica no mesmo lugar quando uma conversa abre.</p>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
